[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muhideen"
version = "0.1.0"
description = "Offline-first masjid digital display system"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "pillow>=10.0",
    "pydantic>=2",
    "adhanpy==1.0.5",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
]

[project.urls]
Homepage = "https://github.com/nexusnv/muhideen"

[tool.hatch.build.targets.wheel]
packages = ["src/muhideen"]

[tool.pytest.ini_options]
markers = [
    "unit: pure domain tests",
    "contract: API schema vs fixtures",
    "integration: engine plus sqlite",
    "property: hypothesis invariants",
    "e2e: served surface",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/muhideen"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = "none"
reportUnnecessaryCast = "none"
include = ["src/muhideen"]
exclude = ["tests", "docs"]

[tool.importlinter]
root_package = "muhideen"

[[tool.importlinter.contracts]]
name = "Layer independence"
type = "layers"
layers = [
    "muhideen.api",
    "muhideen.engine",
    "muhideen.adapters",
    "muhideen.domain",
    "muhideen.core",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pyright>=1.1",
    "import-linter>=2.13",
]
