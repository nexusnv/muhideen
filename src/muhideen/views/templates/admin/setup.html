<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<main id="wizard">
  <h1>Setup</h1>
  <section data-step="1">
    <label><span>Masjid name</span><input id="w-name" type="text"></label>
    <label>Zone<input id="w-zone" type="text" placeholder="SGR01"></label>
  </section>
  <section data-step="2" hidden>
    <label><input id="w-calc" type="checkbox"> <span>Offline calculation only</span></label>
    <label>Lat<input id="w-lat" type="number" step="any"></label>
    <label>Lon<input id="w-lon" type="number" step="any"></label>
  </section>
  <section data-step="3" hidden>
    <label><span>Password</span><input id="w-pass" type="password" autocomplete="new-password"></label>
    <label><span>Confirm password</span><input id="w-pass2" type="password" autocomplete="new-password"></label>
  </section>
  <section data-step="4" hidden>
    <label>Hijri offset<input id="w-hijri" type="number" min="-2" max="2" value="0"></label>
  </section>
  <section data-step="5" hidden>
    <div id="w-review"></div>
    <p>Setup closes after the first admin is created.</p>
  </section>
  <div id="w-msg" role="alert"></div>
  <button id="w-back" type="button" hidden>Back</button>
  <button id="w-next" type="button">Next</button>
</main>
<script src="/static/admin.js"></script>
</body>
</html>
