# Muhideen v1.0 compose: single app service. Screens are provisioned
# Chromium kiosks pointed at the display URLs (see docs/deployment.md for
# the kiosk contract) — compose owns the backend only.
services:
  muhideen:
    build: .
    image: muhideen:${MUHIDEEN_VERSION:-1.0.0}
    ports:
      - "${MUHIDEEN_PORT:-8000}:8000"
    volumes:
      # Hand-edited config + machine-written timetable cache (back this up,
      # not the image). prayer_buffer.json is rewritten by the sync worker —
      # never hand-edit it.
      # First boot: copy the example into place before `compose up`, then
      # edit name/zone/timezone for your masjid:
      #   cp config/muhideen.example.json config/muhideen.json
      # The service fails fast when /config/muhideen.json is missing and
      # hot-reloads hand-edits live (~1s), no rebuild.
      # Permissions: the image runs as the unprivileged `muhideen` user but
      # the bind mount masks the image-side chown, so the sync worker can
      # only write prayer_buffer.json when the host dirs are writable by
      # the container uid. Fix once after first boot:
      #   sudo chown -R $(id -u):$(id -g) config media
      # (Without this the boot log warns and the timetable never caches —
      # the sync retries forever on EACCES.)
      - ./config:/config
      # Adhan audio served to the displays at /media/adhan.mp3, plus
      # playlist image files referenced by the config (carousel rendering
      # is a future slice — see docs/deployment.md).
      - ./media:/media
    environment:
      TZ: ${TZ:-Asia/Kuala_Lumpur}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/version')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
